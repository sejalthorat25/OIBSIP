<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>🌡️ Temperature Converter</h1>

        <div class="form-group">
            <label for="temperature">Enter Temperature</label>

            <input
                type="number"
                id="temperature"
                placeholder="Enter temperature"
                step="any"
            >

            <div id="errorMessage" class="error"></div>
        </div>

        <div class="form-group">
            <label for="unit">Select Input Unit</label>

            <select id="unit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>
        </div>

        <button id="convertBtn">Convert Temperature</button>

        <div id="results" class="results">
            <h2>Results</h2>

            <div class="result-item">
                <span>Celsius:</span>
                <span class="value" id="celsiusResult">-</span>
            </div>

            <div class="result-item">
                <span>Fahrenheit:</span>
                <span class="value" id="fahrenheitResult">-</span>
            </div>

            <div class="result-item">
                <span>Kelvin:</span>
                <span class="value" id="kelvinResult">-</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
